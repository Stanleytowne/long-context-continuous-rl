# Configuration for Long-Text Continuous Learning
# This config supports the three-phase training loop: Proposer -> Solver -> (optional) Judge

# ============================================================================
# Experiment Configuration
# ============================================================================
experiment_timestamp: null  # Will be set dynamically at runtime
experiment_base_dir: null    # Will be set dynamically at runtime

track_benchmarks: false  # Disable for now, can enable custom benchmarks later
benchmark_tracking_dir: null
prompt_optimization_dir: null

# ============================================================================
# Data Configuration
# ============================================================================
data:
  tokenizer: null
  train_files: null  # Not used directly, generated from long text
  val_files: []
  use_shm: False
  prompt_key: prompt
  max_prompt_length: 8096  # Increase for long text + question context
  max_response_length: 4096  # Response length for QA pairs
  max_validation_prompt_length: 8096
  train_batch_size: 32  # Smaller batch size for long contexts
  val_batch_size: 64
  return_raw_input_ids: False
  return_raw_chat: False
  shuffle: True
  filter_overlong_prompts: False
  filter_overlong_prompts_workers: 1
  truncation: error
  seed: 42
  
# ============================================================================
# Actor/Rollout/Reference Model Configuration
# ============================================================================
actor_rollout_ref:
  hybrid_engine: True
  model:
    path: Qwen/Qwen2.5-7B  # Default model, can be overridden
    use_shm: false
    pretrained_tokenizer: True
    external_lib: null
    override_config: {}
    enable_gradient_checkpointing: True
    use_remove_padding: True
    use_liger: False
    use_fused_kernels: True
    trust_remote_code: True
    
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 128
    ppo_micro_batch_size: null
    ppo_micro_batch_size_per_gpu: 4
    use_dynamic_bsz: False
    ppo_max_token_len_per_gpu: 16384
    grad_clip: 1.0
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 3.0
    entropy_coeff: 0.001
    use_kl_loss: False
    kl_loss_coef: 0.001
    use_torch_compile: True
    kl_loss_type: low_var_kl
    ppo_epochs: 1
    shuffle: False
    loss_agg_mode: "token-mean"
    ulysses_sequence_parallel_size: 1
    entropy_from_logits_with_chunking: False
    entropy_checkpointing: False
    
    policy_loss:
      loss_mode: "vanilla"
      clip_cov_ratio: 0.0002
      clip_cov_lb: 1.0
      clip_cov_ub: 5.0
      kl_cov_ratio: 0.0002
      ppo_kl_coef: 0.1
      
    checkpoint:
      save_contents: ['model', 'optimizer', 'extra']
      load_contents: ${actor_rollout_ref.actor.checkpoint.save_contents}
      
    optim:
      lr: 1e-6
      lr_warmup_steps: -1
      lr_warmup_steps_ratio: 0.0
      min_lr_ratio: 0.0
      num_cycles: 0.5
      warmup_style: constant
      total_training_steps: -1
      weight_decay: 0.0
      
    fsdp_config:
      wrap_policy:
        min_num_params: 0
      param_offload: False
      optimizer_offload: False
      offload_policy: False
      reshard_after_forward: True
      fsdp_size: -1
      forward_prefetch: False
      
    profiler:
      discrete: False
      all_ranks: False
      ranks: null
      
  ref:
    include_ref: True
    fsdp_config:
      param_offload: False
      reshard_after_forward: True
      forward_prefetch: False
      wrap_policy:
        min_num_params: 0
    use_torch_compile: ${actor_rollout_ref.actor.use_torch_compile}
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: 4
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    ulysses_sequence_parallel_size: ${actor_rollout_ref.actor.ulysses_sequence_parallel_size}
    entropy_from_logits_with_chunking: False
    entropy_checkpointing: False
    profiler:
      discrete: False
      all_ranks: False
      ranks: null
      
  rollout:
    name: vllm
    mode: sync
    chat_scheduler: null
    max_model_len: null
    temperature: 1.0
    top_k: -1
    top_p: 1.0
    use_fire_sampling: False
    prompt_length: ${data.max_prompt_length}
    response_length: ${data.max_response_length}
    dtype: bfloat16
    gpu_memory_utilization: 0.7
    ignore_eos: False
    enforce_eager: True
    free_cache_engine: True
    load_format: dummy_dtensor
    tensor_model_parallel_size: 2
    max_num_batched_tokens: 8192
    max_num_seqs: 512
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: 4
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    disable_log_stats: True
    enable_chunked_prefill: False
    do_sample: True
    n: 1
    multi_stage_wake_up: false
    
    engine_kwargs:
      vllm:
        swap_space: null
        disable_mm_preprocessor_cache: False
      sglang:
        attention_backend: null
        
    val_kwargs:
      top_k: -1
      top_p: 1.0
      temperature: 0
      n: 1
      do_sample: False
      
    multi_turn:
      enable: False
      max_turns: null
      tool_config_path: null
      format: chatml
      
    calculate_log_probs: False
    
    profiler:
      discrete: False
      all_ranks: False
      ranks: null
      
    agent:
      num_workers: 8

# ============================================================================
# Trainer Configuration
# ============================================================================
trainer:
  output_dir: null
  default_data_dir: data
  save_freq: 20
  log_freq: 1
  eval_freq: 10
  test_freq: 20
  val_only: False
  save_tokenizer: True
  max_eval_steps: 1
  rollout_micro_batch_size: 64
  n_gpus_per_node: 4
  nnodes: 1
  save_optimizer: False
  project_name: longtext_continuous_learning
  experiment_name: longtext_qa_experiment
  logger: ['console', 'wandb']
  wandb_tags: null
  wandb_run_id: null
  debug: False
  debug_port: 5680
  critic_warmup: 0
  total_training_steps: 1000
  default_hdfs_dir: null
  remove_previous_ckpt_in_save: False
  del_local_ckpt_after_load: False
  default_local_dir: null
  balance_batch: True
  total_epochs: 50  # More epochs for long-text learning
  profile_steps: null
  
  controller_nsight_options:
    trace: "cuda,nvtx,cublas,ucx"
    cuda-memory-usage: "true"
    cuda-graph-trace: "graph"
    
  worker_nsight_options:
    trace: "cuda,nvtx,cublas,ucx"
    cuda-memory-usage: "true"
    cuda-graph-trace: "graph"
    capture-range: "cudaProfilerApi"
    capture-range-end: null
    kill: none
    
  log_val_generations: 5  # Log some generations for debugging
  rollout_data_dir: null
  validation_data_dir: null
  resume_mode: auto
  resume_from_path: False
  esi_redundant_time: 0
  max_actor_ckpt_to_keep: 3
  max_critic_ckpt_to_keep: 3
  ray_wait_register_center_timeout: 300
  device: cuda

# ============================================================================
# Critic Configuration (not used for now)
# ============================================================================
critic:
  rollout_n: ${actor_rollout_ref.rollout.n}
  strategy: ${actor_rollout_ref.actor.strategy}
  optim:
    lr: 1e-5
    lr_warmup_steps_ratio: 0.0
    min_lr_ratio: null
    warmup_style: constant
    total_training_steps: -1
    weight_decay: 0.01
  model:
    path: Qwen/Qwen2.5-7B
    use_shm: False
    tokenizer_path: ${actor_rollout_ref.model.path}
    override_config: {}
    external_lib: ${actor_rollout_ref.model.external_lib}
    enable_gradient_checkpointing: True
    use_remove_padding: False
    fsdp_config:
      param_offload: False
      grad_offload: False
      optimizer_offload: False
      wrap_policy:
        min_num_params: 0
      offload_policy: False
      reshard_after_forward: True
      fsdp_size: -1
      forward_prefetch: False
  ppo_mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}
  ppo_micro_batch_size: null
  ppo_micro_batch_size_per_gpu: 4
  forward_micro_batch_size: ${critic.ppo_micro_batch_size}
  forward_micro_batch_size_per_gpu: ${critic.ppo_micro_batch_size_per_gpu}
  use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
  ppo_max_token_len_per_gpu: 32768
  forward_max_token_len_per_gpu: ${critic.ppo_max_token_len_per_gpu}
  ulysses_sequence_parallel_size: 1
  ppo_epochs: ${actor_rollout_ref.actor.ppo_epochs}
  shuffle: ${actor_rollout_ref.actor.shuffle}
  grad_clip: 1.0
  cliprange_value: 0.5

# ============================================================================
# Algorithm Configuration
# ============================================================================
algorithm:
  adv_estimator: reinforce_plus_plus
  gamma: 1.0
  lam: 0.95
  norm_adv_by_std_in_grpo: True
  use_kl_in_reward: False
  kl_penalty: kl
  kl_ctrl:
    type: fixed
    kl_coef: 0.0
    horizon: 10000
    target_kl: 0.0
  use_pf_ppo: False
  pf_ppo:
    reweight_method: pow
    weight_pow: 2.0

# ============================================================================
# Reward Model Configuration (not used for longtext)
# ============================================================================
reward_model:
  enable: False
  strategy: fsdp
  model:
    input_tokenizer: ${actor_rollout_ref.model.path}
    path: ~/models/reward_model
    external_lib: ${actor_rollout_ref.model.external_lib}
    use_remove_padding: False
    fsdp_config:
      min_num_params: 0
      param_offload: False
      fsdp_size: -1
  micro_batch_size: null
  micro_batch_size_per_gpu: 4
  max_length: null
  ulysses_sequence_parallel_size: 1
  use_dynamic_bsz: ${critic.use_dynamic_bsz}
  forward_max_token_len_per_gpu: ${critic.forward_max_token_len_per_gpu}
  sandbox_fusion:
    url: null
    max_concurrent: 64
    memory_limit_mb: 1024
  profiler:
    discrete: False
    all_ranks: False
    ranks: null

# ============================================================================
# Ray Configuration
# ============================================================================
ray_init:
  num_cpus: null

# ============================================================================
# Reward Function Configuration
# ============================================================================
reward_fn:
  extraction_type: boxed
  math_metric: deepscaler
  splitter: "Assistant:"
  boxed_retry: False
  
  # LLM Judge configuration for answer evaluation
  llm_model_name: "meta/llama-3.1-405b-instruct"
  temperature: 0.7
  max_tokens: 1000
  top_p: 0.95
  stream: true
  judge_with_actor: False  # Set to True to use actor as judge
  train_judge: False  # Set to True to train judge component
  infer_together: False
  normalize_scores_in_batch: False

# ============================================================================
# AZR Configuration - LONG-TEXT SPECIFIC
# ============================================================================
azr:
  # Task type identifier
  task_type: longtext_qa
  
  # Long text configuration
  long_text:
    path: null  # MUST BE SET: Path to long text file (.txt, .md, .json, .jsonl)
    chunk_size: 2048  # Maximum tokens per chunk
    overlap: 256  # Overlapping tokens between chunks
    use_chunking: true  # Enable chunking for memory efficiency
    chunk_sampling_strategy: random  # Options: random, sequential, weighted
    
    # QA pair generation for SFT warmup
    use_local_model_for_qa: false  # If true, use local model to generate QA pairs; if false, use external LLM API
    local_model_device: auto  # Device for local model: 'auto' (device_map auto), 'cuda', 'cuda:0', 'cuda:1', 'cpu', etc.
    # When use_local_model_for_qa=true, will use actor_rollout_ref.model.path as the generation model
    # When use_local_model_for_qa=false, will use reward_fn.llm_model_name (default: meta/llama-3.1-405b-instruct)
  
  # General settings
  seed: 42
  problem_types:
    - longtext_qa
  pred_data_mix_strategy: "max_new"  # Options: uniform_total, max_new, half_new
  past_epoch_window: 1000
  pretrain_pred_steps: -1
  random_print_max_programs: 3
  
  # Training phases
  train_propose: True  # Enable proposer (generation) phase
  train_solve: True  # Enable solver (prediction) phase - implied, always True
  train_judge: False  # Enable judge training phase (optional)
  self_judge: False  # Use actor as judge
  
  # Data selection strategy
  data_selection_strategy:
    io_n: 3  # Number of reference QA pairs to include
    update_iteration: 1
    data_len: null
    content_max_length: 8096
    max_questions: 10000
    valid_question_filter: all
    batched_estimate: False
  
  # Reward configuration
  reward:
    # Proposer (generation) reward configuration
    generation_reward_config:
      # Reward component weights
      question_quality_weight: 0.3  # α: Question requires text knowledge
      question_difficulty_weight: 0.3  # β: Medium difficulty preferred
      answer_quality_weight: 0.4  # γ: Answer completeness and accuracy
      
      # Difficulty shaping parameters
      min_difficulty_threshold: 0.2  # Below this = too easy
      max_difficulty_threshold: 0.8  # Above this = too hard
      
      # Reference QA pairs
      include_references: 0.5  # Probability of including references (0.0-1.0)
      
    # Solver (prediction) reward configuration
    eval_reward_config:
      exact_match_weight: 0.0  # Not used (too strict for long-form QA)
      semantic_similarity_weight: 1.0  # Use LLM judge for semantic match
      llm_judge_weight: 1.0  # Weight for LLM evaluation
    
    # Number of samples for difficulty estimation
    n_samples: 3
  
  # Prompt optimization (optional)
  enable_actor_prompt_optimization: false
  prompt_optimization:
    frequency: 10
    accuracy_threshold: 0.3
    max_improvements_per_step: 3
    enable_safety_validation: true
    optimization_temperature: 0.7
    optimization_max_tokens: 1024
    backup_prompts: true
    output_dir: null
  
  # Benchmark tracking (optional)
  benchmark_tracking:
    output_dir: null
    enable: false
  
  # Executor settings (not used for longtext)
  executor_cleanup_frequency: 5

